services:
  - type: web
    name: athletica-log
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    domains:
      - athletica.emminger-net.de
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athletica-log-db
          property: connectionString
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_USERNAME
        value: athletica
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DOCS_ENABLED
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: https://athletica.emminger-net.de

databases:
  - name: athletica-log-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: athletica_log
    user: athletica_log
    diskSizeGB: 5
    ipAllowList: []
