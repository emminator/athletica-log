name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Start development stack
        run: docker compose up --build --detach
      - name: Ruff
        run: docker compose exec -T backend ruff check .
      - name: Pytest
        run: docker compose exec -T backend python -m pytest -q
      - name: ESLint
        run: docker compose exec -T frontend pnpm lint
      - name: TypeScript
        run: docker compose exec -T frontend pnpm typecheck
      - name: Vitest
        run: docker compose exec -T frontend pnpm test
      - name: Stop development stack
        if: always()
        run: docker compose down

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag athletica-log:${{ github.sha }} .
